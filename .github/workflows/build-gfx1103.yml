name: Build llama.cpp HIP gfx1103

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download TheRock HIP SDK
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\TheRock | Out-Null
          curl.exe -L --retry 3 -o C:\therock.tar.gz https://rocm.nightlies.amd.com/tarball/therock-dist-windows-gfx110X-all-7.14.0a20260524.tar.gz
          tar -xzf C:\therock.tar.gz -C C:\TheRock
          Get-ChildItem C:\TheRock | Select-Object Name

      - name: Setup MSVC env
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        shell: pwsh
        run: |
          $env:HIP_PATH = "C:/TheRock"
          cl.exe 2>&1 | Select-Object -First 1
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=cl.exe -DCMAKE_CXX_COMPILER=cl.exe `
            -DGGML_HIP=ON -DAMDGPU_TARGETS=gfx1103 `
            -DGGML_NATIVE=OFF -DLLAMA_CURL=OFF

      - name: Build
        shell: pwsh
        run: |
          $env:HIP_PATH = "C:/TheRock"
          cmake --build build --config Release -j

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: llama-gfx1103
          path: build/bin/**