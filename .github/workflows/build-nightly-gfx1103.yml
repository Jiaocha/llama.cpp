name: Daily Nightly Build (llama.cpp + TheRock 780M gfx1103)

'on':
  schedule:
    # 每天北京时间 06:00 (UTC 22:00) 自动执行
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: 'Target llama.cpp repository'
        type: string
        required: false
        default: 'ggml-org/llama.cpp'
      upstream_ref:
        description: 'Branch, tag, or commit to build'
        type: string
        required: false
        default: 'master'
      therock_version:
        description: 'Pin TheRock tarball version, e.g. 10.3.0a20261028 (empty = auto detect)'
        type: string
        required: false
        default: ''
      build_windows:
        description: 'Build Windows package'
        type: boolean
        required: false
        default: true
      build_linux:
        description: 'Build Linux / WSL2 package'
        type: boolean
        required: false
        default: true
      create_release:
        description: 'Publish as GitHub Release (nightly-gfx1103 tag)'
        type: boolean
        required: false
        default: true
      force_rebuild:
        description: 'Ignore the update gate and build immediately'
        type: boolean
        required: false
        default: false
      gate_check_only:
        description: 'Run only the update gate on ubuntu (no build minutes)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: nightly-gfx1103-build
  cancel-in-progress: false

jobs:
  # 0. 版本门控：检查上游是否有值得构建的新提交或 TheRock SDK 大版本升级
  check-update:
    name: Check for a new version (gate)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      UPSTREAM_REPO: ${{ github.event.inputs.upstream_repo || vars.UPSTREAM_REPO || 'ggml-org/llama.cpp' }}
      UPSTREAM_REF: ${{ github.event.inputs.upstream_ref || vars.UPSTREAM_REF || 'master' }}
      RELEASE_TAG: ${{ vars.NIGHTLY_RELEASE_TAG || 'nightly-gfx1103' }}
      PIN_THEROCK: ${{ github.event.inputs.therock_version || vars.THEROCK_VERSION }}
      MIN_INTERVAL_HOURS: ${{ vars.MIN_INTERVAL_HOURS || '0' }}
      MAX_STALE_HOURS: ${{ vars.MAX_STALE_HOURS || '168' }}
      FORCE_REBUILD: ${{ github.event.inputs.force_rebuild || 'false' }}
      EVENT_NAME: ${{ github.event_name }}
    outputs:
      should_build: ${{ steps.gate.outputs.should_build }}
      reason: ${{ steps.gate.outputs.reason }}
      upstream_repo: ${{ steps.gate.outputs.upstream_repo }}
      upstream_ref: ${{ steps.gate.outputs.upstream_ref }}
      upstream_sha: ${{ steps.gate.outputs.upstream_sha }}
      therock_version: ${{ steps.gate.outputs.therock_version }}
    steps:
      - name: Checkout CI scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Evaluate update gate
        id: gate
        run: bash .github/scripts/nightly-gate.sh

  # 1. Windows 原生绿色便携包构建 (AMD Radeon 780M gfx1103)
  build-windows-780m-gfx1103:
    name: Build Windows package (gfx1103)
    needs: check-update
    if: ${{ !cancelled() && (needs.check-update.outputs.should_build == 'true' || github.event.inputs.force_rebuild == 'true') && github.event.inputs.gate_check_only != 'true' && github.event.inputs.build_windows != 'false' }}
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      UPSTREAM_REPO: ${{ needs.check-update.outputs.upstream_repo }}
      UPSTREAM_REF: ${{ needs.check-update.outputs.upstream_ref }}
      PRESET_THEROCK: ${{ needs.check-update.outputs.therock_version }}
    outputs:
      zip_name: ${{ steps.pack.outputs.zip_name }}
      commit: ${{ steps.meta.outputs.commit }}
      commit_full: ${{ steps.meta.outputs.commit_full }}
      build_date: ${{ steps.meta.outputs.build_date }}
      built_at: ${{ steps.meta.outputs.built_at }}
      therock_ver: ${{ steps.therock.outputs.sdk_ver }}
    steps:
      - name: Checkout latest llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_REF }}
          submodules: recursive
          fetch-depth: 1

      - name: Record Build Metadata
        id: meta
        shell: pwsh
        run: |
          $commit = git rev-parse --short HEAD
          $commitFull = git rev-parse HEAD
          $dateStr = Get-Date -Format "yyyy-MM-dd"
          $nowUtc = (Get-Date).ToUniversalTime()
          $builtAt = '{0:0000}-{1:00}-{2:00}T{3:00}:{4:00}:{5:00}Z' -f $nowUtc.Year, $nowUtc.Month, $nowUtc.Day, $nowUtc.Hour, $nowUtc.Minute, $nowUtc.Second
          "commit=$commit" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "commit_full=$commitFull" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "build_date=$dateStr" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "built_at=$builtAt" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "LLAMA_COMMIT=$commit" | Out-File -FilePath $env:GITHUB_ENV -Append
          "LLAMA_COMMIT_FULL=$commitFull" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BUILD_DATE=$dateStr" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BUILT_AT_UTC=$builtAt" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Ninja
        uses: ashutoshvarma/setup-ninja@master
        with:
          version: 1.11.1

      - name: Dynamic Detect & Download Latest TheRock SDK
        id: therock
        shell: pwsh
        run: |
          $tarUrl = ""
          $tarName = ""
          try {
            $resp = Invoke-WebRequest -Uri "https://nightly.repo.amd.com/rocm/core/tarball/" -UseBasicParsing -TimeoutSec 30
            if ($resp.Content -match 'const files = (\[.*?\]);') {
              $files = $Matches[1] | ConvertFrom-Json
              $matched = $files | Where-Object { 
                $_.name -match '^therock-dist-windows-gfx110X-all-10\..*\.tar\.gz$' -and $_.name -notmatch 'tests' 
              } | Sort-Object mtime -Descending | Select-Object -First 1
              if ($matched) {
                $tarName = $matched.name
                $tarUrl = "https://nightly.repo.amd.com/rocm/core/tarball/$tarName"
              }
            }
          } catch {}
          
          if (-not $tarUrl) {
            $tarName = "therock-dist-windows-gfx110X-all-10.3.0a20261028.tar.gz"
            $tarUrl = "https://nightly.repo.amd.com/rocm/core/tarball/$tarName"
          }
          $sdkVer = $tarName -replace '^therock-dist-windows-gfx110X-all-', '' -replace '\.tar\.gz$', ''
          if ($env:PRESET_THEROCK) {
            $tarName = "therock-dist-windows-gfx110X-all-$env:PRESET_THEROCK.tar.gz"
            $tarUrl = "https://nightly.repo.amd.com/rocm/core/tarball/$tarName"
            $sdkVer = $env:PRESET_THEROCK
          }
          "sdk_ver=$sdkVer" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "THEROCK_VER=$sdkVer" | Out-File -FilePath $env:GITHUB_ENV -Append
          
          New-Item -ItemType Directory -Force -Path C:\TheRock | Out-Null
          curl.exe -L --retry 5 --retry-delay 3 -o C:\therock.tar.gz $tarUrl
          tar -xzf C:\therock.tar.gz -C C:\TheRock

      - name: Configure and Build
        shell: pwsh
        run: |
          $env:HIP_PATH = "C:/TheRock"
          $env:HIP_PLATFORM = "amd"
          $env:Path = "C:\TheRock\bin;C:\TheRock\lib\llvm\bin;$env:Path"
          cmake -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DGGML_HIP=ON `
            -DAMDGPU_TARGETS=gfx1103 `
            -DGGML_NATIVE=OFF `
            -DLLAMA_CURL=ON
          cmake --build build --config Release -j 4

      - name: Assemble Windows Portable Package
        id: pack
        shell: pwsh
        run: |
          $packDir = "dist/llama-gfx1103-hip-portable"
          $binDir = "$packDir/bin"
          $kpackDir = "$packDir/.kpack"
          New-Item -ItemType Directory -Force -Path $binDir | Out-Null
          New-Item -ItemType Directory -Force -Path $kpackDir | Out-Null
          
          Get-ChildItem "build/bin" -Filter "*.exe" | Where-Object { $_.Name -notmatch '^test-' } | ForEach-Object {
            Copy-Item $_.FullName $binDir/ -Force
          }
          Copy-Item build/bin/*.dll $binDir/ -Force
          
          $runtimeDlls = @(
            "amdhip64_7.dll", "amd_comgr.dll", "hipblas.dll", "rocblas.dll", "rocsolver.dll",
            "hipsolver.dll", "libhipblaslt.dll", "libtensilelite-host.dll", "origami.dll",
            "rocm-openblas.dll", "rocm-openblas64.dll", "rocm_kpack.dll"
          )
          foreach ($dll in $runtimeDlls) {
            if (Test-Path "C:\TheRock\bin\$dll") { Copy-Item "C:\TheRock\bin\$dll" $binDir/ -Force }
          }
          Get-ChildItem "C:\TheRock\bin" -Filter "hiprtc*.dll" | ForEach-Object { Copy-Item $_.FullName $binDir/ -Force }
          if (Test-Path "C:\TheRock\bin\rocblas") { Copy-Item -Recurse -Force "C:\TheRock\bin\rocblas" "$binDir/rocblas" }
          if (Test-Path "C:\TheRock\.kpack\blas_lib_gfx1103.kpack") {
            Copy-Item "C:\TheRock\.kpack\blas_lib_gfx1103.kpack" $kpackDir/ -Force
          } else {
            Get-ChildItem "C:\TheRock" -Recurse -Filter "blas_lib_gfx1103.kpack" | Select-Object -First 1 | ForEach-Object {
              Copy-Item $_.FullName $kpackDir/ -Force
            }
          }
          
          Set-Content -Path "$packDir/llama-cli.bat" -Value "@echo off`r`nchcp 65001 >nul 2>&1`r`n`"%~dp0bin\llama-cli.exe`" %*" -Encoding ASCII
          Set-Content -Path "$packDir/llama-server.bat" -Value "@echo off`r`nchcp 65001 >nul 2>&1`r`n`"%~dp0bin\llama-server.exe`" %*" -Encoding ASCII
          Set-Content -Path "$packDir/llama-bench.bat" -Value "@echo off`r`nchcp 65001 >nul 2>&1`r`n`"%~dp0bin\llama-bench.exe`" %*" -Encoding ASCII

          $readmeLines = @(
            "# llama.cpp HIP Portable - Windows (Radeon 780M gfx1103)",
            "==============================================================",
            "- 构建时间: $($env:BUILD_DATE) (每日凌晨 06:00 自动构建)",
            "- llama.cpp Commit: $($env:LLAMA_COMMIT_FULL)",
            "- TheRock ROCm 运行时: $($env:THEROCK_VER)",
            "- 适配硬件: AMD Radeon 780M (gfx1103 / Ryzen 8845HS / 7840HS / 8700G)",
            "- 特性: 内嵌完整 .kpack 算子包与 HIP 运行时，解压即用，无需安装 ROCm。",
            "",
            "## 常用命令",
            "- 命令行对话: llama-cli.bat -m 模型.gguf -ngl 99 -fa on",
            "- WebUI/API 服务: llama-server.bat -m 模型.gguf -ngl 99 -fa on --port 8080"
          )
          Set-Content -Path "$packDir/README.md" -Value ($readmeLines -join "`r`n") -Encoding UTF8
          
          # 打包 ZIP（纯便携包，无需 .sha256 杂项）
          $zipName = "llama-$($env:BUILD_DATE)-b$($env:LLAMA_COMMIT)-win-hip-gfx1103.zip"
          Compress-Archive -Path "$packDir/*" -DestinationPath "dist/$zipName" -Force
          "zip_name=$zipName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: dist/*.zip
          retention-days: 14

  # 2. Linux / WSL2 便携包构建 (AMD Radeon 780M gfx1103)
  build-linux-wsl-780m-gfx1103:
    name: Build Linux/WSL2 package (gfx1103)
    needs: check-update
    if: ${{ !cancelled() && (needs.check-update.outputs.should_build == 'true' || github.event.inputs.force_rebuild == 'true') && github.event.inputs.gate_check_only != 'true' && github.event.inputs.build_windows != 'false' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      UPSTREAM_REPO: ${{ needs.check-update.outputs.upstream_repo }}
      UPSTREAM_REF: ${{ needs.check-update.outputs.upstream_ref }}
      PRESET_THEROCK: ${{ needs.check-update.outputs.therock_version }}
    outputs:
      tar_name: ${{ steps.pack.outputs.tar_name }}
    steps:
      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build curl libcurl4-openssl-dev

      - name: Checkout latest llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_REF }}
          submodules: recursive
          fetch-depth: 1

      - name: Dynamic Detect & Download Latest TheRock Linux SDK
        id: therock
        run: |
          TAR_NAME=""
          TAR_URL=""
          TAR_LIST=$(curl -sS --max-time 30 "https://nightly.repo.amd.com/rocm/core/tarball/" | grep -oE 'therock-dist-linux-gfx110X-all-[0-9][^"]*\.tar\.gz' | grep -v 'tests' | sort -uV)
          TAR_NAME=$(echo "$TAR_LIST" | tail -1)
          if [ -n "$TAR_NAME" ]; then
            TAR_URL="https://nightly.repo.amd.com/rocm/core/tarball/$TAR_NAME"
          else
            TAR_NAME="therock-dist-linux-gfx110X-all-10.3.0a20261028.tar.gz"
            TAR_URL="https://nightly.repo.amd.com/rocm/core/tarball/$TAR_NAME"
          fi
          
          if [ -n "$PRESET_THEROCK" ]; then
            TAR_NAME="therock-dist-linux-gfx110X-all-${PRESET_THEROCK}.tar.gz"
            TAR_URL="https://nightly.repo.amd.com/rocm/core/tarball/$TAR_NAME"
          fi
          
          echo "Downloading TheRock Linux SDK: $TAR_URL ..."
          mkdir -p /opt/TheRock
          curl -sSL --retry 5 --retry-delay 3 "$TAR_URL" -o /tmp/therock.tar.gz
          tar -xzf /tmp/therock.tar.gz -C /opt/TheRock
          echo "TheRock Linux ready."

      - name: Configure and Build (Linux/HIP)
        run: |
          export ROCM_PATH="/opt/TheRock"
          export HIP_PATH="/opt/TheRock"
          export PATH="/opt/TheRock/bin:/opt/TheRock/llvm/bin:$PATH"
          export LD_LIBRARY_PATH="/opt/TheRock/lib:$LD_LIBRARY_PATH"
          
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_HIP=ON \
            -DAMDGPU_TARGETS=gfx1103 \
            -DGGML_NATIVE=OFF \
            -DLLAMA_CURL=ON
            
          cmake --build build --config Release -j $(nproc)

      - name: Assemble Linux Portable Package
        id: pack
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +%Y-%m-%d)
          PACK_DIR="dist/llama-linux-wsl-gfx1103-hip-portable"
          BIN_DIR="$PACK_DIR/bin"
          LIB_DIR="$PACK_DIR/lib"
          KPACK_DIR="$PACK_DIR/.kpack"
          mkdir -p "$BIN_DIR" "$LIB_DIR" "$KPACK_DIR"
          
          # 复制编译生成的二进制
          find build/bin -maxdepth 1 -type f -executable ! -name 'test-*' -exec cp {} "$BIN_DIR/" \;
          find build/bin -name '*.so*' -exec cp {} "$LIB_DIR/" \; 2>/dev/null || true
          
          # 复制 TheRock Linux 核心动态库
          find /opt/TheRock/lib -name 'libamdhip64*.so*' -exec cp -d {} "$LIB_DIR/" \; 2>/dev/null || true
          find /opt/TheRock/lib -name 'libhipblas*.so*' -exec cp -d {} "$LIB_DIR/" \; 2>/dev/null || true
          find /opt/TheRock/lib -name 'librocblas*.so*' -exec cp -d {} "$LIB_DIR/" \; 2>/dev/null || true
          find /opt/TheRock/lib -name 'libamd_comgr*.so*' -exec cp -d {} "$LIB_DIR/" \; 2>/dev/null || true
          find /opt/TheRock/lib -name 'libhsa-runtime*.so*' -exec cp -d {} "$LIB_DIR/" \; 2>/dev/null || true
          
          # 复制算子与 .kpack
          if [ -d /opt/TheRock/lib/rocblas ]; then
            cp -r /opt/TheRock/lib/rocblas "$LIB_DIR/"
          fi
          find /opt/TheRock -name '*gfx1103*.kpack' -exec cp {} "$KPACK_DIR/" \; 2>/dev/null || true
          
          # 写入 WSL2/Linux 便捷运行脚本 (自动注入 HSA_OVERRIDE_GFX_VERSION=11.0.3)
          cat << 'EOF' > "$PACK_DIR/run-cli.sh"
          #!/usr/bin/env bash
          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export LD_LIBRARY_PATH="$SCRIPT_DIR/lib:$LD_LIBRARY_PATH"
          export HSA_OVERRIDE_GFX_VERSION=11.0.3
          exec "$SCRIPT_DIR/bin/llama-cli" "$@"
          EOF
          chmod +x "$PACK_DIR/run-cli.sh"

          cat << 'EOF' > "$PACK_DIR/run-server.sh"
          #!/usr/bin/env bash
          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export LD_LIBRARY_PATH="$SCRIPT_DIR/lib:$LD_LIBRARY_PATH"
          export HSA_OVERRIDE_GFX_VERSION=11.0.3
          exec "$SCRIPT_DIR/bin/llama-server" "$@"
          EOF
          chmod +x "$PACK_DIR/run-server.sh"

          cat << EOF > "$PACK_DIR/README.md"
          # llama.cpp Linux / WSL2 HIP Portable (Radeon 780M gfx1103)
          ==============================================================
          - 针对 AMD Radeon 780M (gfx1103) 在 Linux 及 Windows WSL2 Ubuntu 环境加速
          - 内嵌核心运行时与算子库，免装大型 ROCm SDK
          - 运行前请确保 WSL2 具备 /dev/kfd 与 /dev/dri 权限
          
          ## 常用命令
          - 终端运行: ./run-cli.sh -m 模型.gguf -ngl 99 -fa on
          - 服务运行: ./run-server.sh -m 模型.gguf -ngl 99 -fa on --port 8080
          EOF

          TAR_NAME="llama-${BUILD_DATE}-b${COMMIT}-linux-wsl-hip-gfx1103.tar.gz"
          tar -czf "dist/${TAR_NAME}" -C "dist" "llama-linux-wsl-gfx1103-hip-portable"
          echo "tar_name=$TAR_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: dist/*.tar.gz
          retention-days: 14

  # 3. 聚合发布 GitHub Nightly Release (无 .sha256 杂项)
  publish-release:
    name: Publish Nightly Release
    needs: [check-update, build-windows-780m-gfx1103, build-linux-wsl-780m-gfx1103]
    if: ${{ github.event_name == 'schedule' || github.event.inputs.create_release != 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ vars.NIGHTLY_RELEASE_TAG || 'nightly-gfx1103' }}
      KEEP_ASSETS: ${{ vars.KEEP_NIGHTLY_ASSETS || '7' }}
    steps:
      - name: Download Windows Package
        uses: actions/download-artifact@v4
        with:
          name: windows-package
          path: release-assets
        continue-on-error: true

      - name: Download Linux Package
        uses: actions/download-artifact@v4
        with:
          name: linux-package
          path: release-assets
        continue-on-error: true

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "llama.cpp Nightly (Radeon 780M gfx1103) - ${{ needs.build-windows-780m-gfx1103.outputs.build_date }}"
          body: |
            ## 🚀 llama.cpp Nightly Build for AMD Radeon 780M (gfx1103)
            
            ### 📋 构建版本元数据记录 (Build Metadata)
            - **构建日期**: `${{ needs.build-windows-780m-gfx1103.outputs.build_date }}` (每日凌晨 06:00 自动构建)
            - **llama.cpp Commit**: [`${{ needs.build-windows-780m-gfx1103.outputs.commit }}`](https://github.com/ggml-org/llama.cpp/commit/${{ needs.build-windows-780m-gfx1103.outputs.commit_full }})
            - **TheRock ROCm SDK**: `${{ needs.build-windows-780m-gfx1103.outputs.therock_ver }}`
            - **适配架构**: AMD Radeon 780M (`gfx1103` / Ryzen 8845HS / 7840HS / 8700G)
            
            ### 📦 便携压缩包 (解压即用，无 .sha256 杂项)
            - **Windows 版**: `${{ needs.build-windows-780m-gfx1103.outputs.zip_name }}` (双击 `llama-server.bat` 运行)
            - **Linux / WSL2 版**: `${{ needs.build-linux-wsl-780m-gfx1103.outputs.tar_name }}` (通过 `./run-server.sh` 运行)

            <!-- ci-build-state: {"sha":"${{ needs.build-windows-780m-gfx1103.outputs.commit_full }}","therock":"${{ needs.build-windows-780m-gfx1103.outputs.therock_ver }}","built_at":"${{ needs.build-windows-780m-gfx1103.outputs.built_at }}"} -->
          files: |
            release-assets/*

      - name: Clean up old assets (trim to ${{ env.KEEP_ASSETS }} latest builds)
        run: |
          KEEP=${KEEP_ASSETS:-7}
          REL_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.id')
          if [ -z "$REL_ID" ]; then exit 0; fi
          
          # 清理历史遗留的所有 .sha256 文件
          ALL_SHA_ASSETS=$(gh api "repos/$GITHUB_REPOSITORY/releases/$REL_ID/assets?per_page=100" --paginate --jq '.[] | select(.name | endswith(".sha256")) | .id')
          for aid in $ALL_SHA_ASSETS; do
            echo "Deleting legacy checksum asset: $aid"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$aid" || true
          done
          
          # 保留最近 KEEP 个 Windows zip 和 Linux tar.gz
          for EXT in "zip" "tar.gz"; do
            DOOMED=$(gh api "repos/$GITHUB_REPOSITORY/releases/$REL_ID/assets?per_page=100" --paginate \
              --jq ".[] | select(.name | endswith(\".$EXT\")) | [.id, .created_at] | @tsv" | \
              sort -k2 -r | tail -n +$((KEEP + 1)) | cut -f1)
            for aid in $DOOMED; do
              echo "Trimming old $EXT asset: $aid"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$aid" || true
            done
          done
