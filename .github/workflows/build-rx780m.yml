name: Build for Ryzen 7 8845HS + Radeon 780M

on:
  workflow_dispatch:

jobs:
  build-win64-vulkan:
    runs-on: windows-2025
    name: Win64 Vulkan (RDNA3 + Zen4)

    env:
      VULKAN_VERSION: 1.4.313.2

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Vulkan SDK
        id: get_vulkan
        run: |
          curl.exe -o $env:RUNNER_TEMP/VulkanSDK-Installer.exe -L "https://sdk.lunarg.com/sdk/download/${env:VULKAN_VERSION}/windows/vulkansdk-windows-X64-${env:VULKAN_VERSION}.exe"
          & "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\${env:VULKAN_VERSION}"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\${env:VULKAN_VERSION}\bin"

      - name: Install Ninja
        id: install_ninja
        run: |
          choco install ninja

      - name: Build
        id: cmake_build
        run: |
          cmake -S . -B build `
            -G "Ninja Multi-Config" `
            -D CMAKE_TOOLCHAIN_FILE=cmake/x64-windows-llvm.cmake `
            -DCMAKE_BUILD_TYPE=Release `
            -DGGML_NATIVE=OFF `
            -DLLAMA_BUILD_SERVER=ON `
            -DGGML_RPC=ON `
            -DGGML_BACKEND_DL=ON `
            -DGGML_CPU_ALL_VARIANTS=ON `
            -DGGML_VULKAN=ON `
            -DLLAMA_BUILD_BORINGSSL=ON
          cmake --build build --config Release -j ${env:NUMBER_OF_PROCESSORS}

      - name: Collect binaries
        run: |
          $outDir = "release-package"
          New-Item -ItemType Directory -Force -Path $outDir
          Copy-Item "build/bin/Release/*.exe" -Destination $outDir
          Copy-Item "build/bin/Release/*.dll" -Destination $outDir -ErrorAction SilentlyContinue
          Get-ChildItem $outDir

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llama-cpp-vulkan-win64-780m
          path: release-package/
          if-no-files-found: error
          retention-days: 90
